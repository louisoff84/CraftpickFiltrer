name: Build multi-version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: "1.8.8-1.8.9"
            java: "8"
          - target: "1.8.9-1.20.x"
            java: "8"
          - target: "1.21.x"
            java: "21"
          - target: "26.2"
            java: "21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Compiler
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Nommer le JAR
        run: cp target/CraftpickFiltrer-*.jar "target/CraftpickFiltrer-${{ matrix.target }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: CraftpickFiltrer-${{ matrix.target }}
          path: target/CraftpickFiltrer-${{ matrix.target }}.jar
          if-no-files-found: error
