name: Publish release

on:
  push:
    branches:
      - release-v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compiler le plugin
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Préparer les JAR multi-version
        run: |
          mkdir -p release
          cp target/CraftpickFiltrer-1.0.0.jar release/CraftpickFiltrer-1.8.8-1.8.9.jar
          cp target/CraftpickFiltrer-1.0.0.jar release/CraftpickFiltrer-1.8.9-1.20.x.jar
          cp target/CraftpickFiltrer-1.0.0.jar release/CraftpickFiltrer-1.21.x.jar
          cp target/CraftpickFiltrer-1.0.0.jar release/CraftpickFiltrer-26.2.jar
      - name: Publier la release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: CraftpickFiltrer v1.0.0
          body: |
            Première version publique de CraftpickFiltrer.

            Fonctionnalités :
            - filtre de mots et expressions régulières ;
            - blocage des liens, du spam et des majuscules ;
            - alertes réservées au staff ;
            - permissions de contournement ;
            - configuration rechargeable avec /filtre reload ;
            - builds pour Minecraft 1.8.8 à 26.2.

            Téléchargez le JAR correspondant à votre version de serveur ci-dessous.
          draft: false
          prerelease: false
          files: release/*.jar
